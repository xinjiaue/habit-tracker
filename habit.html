        const el = document.createElement('div');
        el.style.cssText = 'flex:1;text-align:center;font-size:9px;color:var(--muted);font-weight:500';
        el.textContent = l;
        dowWrap.appendChild(el);
      });

      habits.forEach(habit => {
        const card = document.createElement('div');
        card.className = 'report-habit-card';

        // Count logged
        let logged = 0;
        for (let day = 1; day <= daysInMonth; day++) {
          const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
          const entry = allEntries.find(e => e.habitId === habit.id && e.date === dateStr);
          if (entry && !entry.value?.skipped) logged++;
        }

        // Header
        const hdr = document.createElement('div');
        hdr.className = 'rhc-header';
        hdr.innerHTML = `<div class="rhc-icon">${ICONS[habit.id]}</div>
          <div><div class="rhc-name">${habit.name}</div></div>
          <div class="rhc-score" style="color:${habit.color}">${logged}/${daysInMonth} days</div>`;
        card.appendChild(hdr);

        // Day of week header row
        const dowRow = document.createElement('div');
        dowRow.style.cssText = 'display:flex;gap:2px;margin-bottom:3px';
        ['S','M','T','W','T','F','S'].forEach(l => {
          const el = document.createElement('div');
          el.style.cssText = 'flex:1;text-align:center;font-size:8px;color:var(--muted)';
          el.textContent = l;
          dowRow.appendChild(el);
        });
        card.appendChild(dowRow);

        // Calendar grid
        const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
        const gridWrap = document.createElement('div');
        gridWrap.className = 'rhc-grid';

        for (let i = 0; i < totalCells; i += 7) {
          const row = document.createElement('div');
          row.className = 'rhc-row';
          for (let j = 0; j < 7; j++) {
            const cellIdx = i + j;
            const dayNum  = cellIdx - firstDay + 1;
            const cell    = document.createElement('div');
            cell.className = 'rhc-cell';
            cell.style.height = '10px';

            if (dayNum < 1 || dayNum > daysInMonth) {
              cell.style.background = 'transparent';
            } else {
              const dateStr  = year + '-' + String(month+1).padStart(2,'0') + '-' + String(dayNum).padStart(2,'0');
              const isToday  = dateStr === todayStr;
              const isFuture = dateStr > todayStr;
              const entry    = allEntries.find(e => e.habitId === habit.id && e.date === dateStr);

              if (isFuture) {
                cell.style.background = 'var(--white)';
                cell.style.border = '1px solid var(--border)';
              } else {
                cell.style.background = getDurationColor(habit, entry);
              }

              if (isToday) {
                cell.style.outline = '2px solid ' + habit.color;
                cell.style.outlineOffset = '1px';
              }
              cell.title = dateStr + (entry ? ' ✓' : '');
            }
            row.appendChild(cell);
          }
          gridWrap.appendChild(row);
        }
        card.appendChild(gridWrap);

        // Legend
        const legend = document.createElement('div');
        legend.className = 'color-legend';
        legend.style.marginTop = '8px';
        getLegend(habit).forEach(item => {
          legend.innerHTML += `<div class="legend-item">
            <div class="legend-dot" style="background:${item.color}"></div>
            <span>${item.label}</span>
          </div>`;
        });
        card.appendChild(legend);
        container.appendChild(card);
      });
    }

    /* ==============================
       YEARLY REPORT
       One habit at a time (selector).
       365/366 days shown as a grid.
       Rows = weeks, cols = days.
       Future = white.
    ============================== */
    function renderYearlyReport(container) {
      const today    = new Date();
      const year     = today.getFullYear();
      const todayStr = today.toISOString().split('T')[0];
      const isLeap   = (year%4===0 && year%100!==0) || year%400===0;
      const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const daysInMonth = [31, isLeap?29:28, 31,30,31,30,31,31,30,31,30,31];

      /* Habit selector */
      const selector = document.createElement('div');
      selector.className = 'habit-selector';
      habits.forEach((habit, idx) => {
        const btn = document.createElement('button');
        btn.className = 'habit-sel-btn' + (idx===yearlyHabitIdx ? ' active' : '');
        const iconSmall = (ICONS[habit.id] || '').replace('viewBox', 'style="width:16px;height:16px" viewBox');
        btn.innerHTML = '<span>' + iconSmall + '</span>' + habit.name;
        if (idx===yearlyHabitIdx) { btn.style.background=habit.color; btn.style.borderColor=habit.color; }
        btn.onclick = () => { yearlyHabitIdx=idx; renderReports(); };
        selector.appendChild(btn);
      });
      container.appendChild(selector);

      const habit = habits[yearlyHabitIdx];

      /* Stats */
      let loggedCount=0, skipCount=0;
      for (let m=0; m<12; m++) {
        for (let d=1; d<=daysInMonth[m]; d++) {
          const dateStr = year+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
          if (dateStr > todayStr) continue;
          const entry = allEntries.find(e=>e.habitId===habit.id && e.date===dateStr);
          if (entry && !entry.value?.skipped) loggedCount++;
          if (entry && entry.value?.skipped)  skipCount++;
        }
      }

      const statsRow = document.createElement('div');
      statsRow.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px';
      statsRow.innerHTML = `
        <div style="background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px">
          <div style="font-size:20px;font-weight:500;color:${habit.color}">${loggedCount}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">Days done</div>
        </div>
        <div style="background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px">
          <div style="font-size:20px;font-weight:500">${calcStreak(habit.id)}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">Streak</div>
        </div>
        <div style="background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px">
          <div style="font-size:20px;font-weight:500">${skipCount}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">Rest days</div>
        </div>`;
      container.appendChild(statsRow);

      /*
        GRID LAYOUT (like bullet journal photo):
        - Columns = 12 months (Jan-Dec)
        - Rows = days 1-31
        - Each cell = one day
        - Future = white, logged = color, rest = gray, empty = light
      */
      const card = document.createElement('div');
      card.className = 'report-habit-card';
      card.style.overflowX = 'auto';

      /* Month header row */
      const monthHeaderRow = document.createElement('div');
      monthHeaderRow.style.cssText = 'display:flex;margin-bottom:4px;padding-left:24px';
      monthNames.forEach(m => {
        const lbl = document.createElement('div');
        lbl.style.cssText = 'flex:1;text-align:center;font-size:8px;font-weight:500;color:var(--muted);min-width:20px';
        lbl.textContent = m;
        monthHeaderRow.appendChild(lbl);
      });
      card.appendChild(monthHeaderRow);

      /* Grid: 31 rows x 12 cols */
      const gridWrap = document.createElement('div');
      gridWrap.style.cssText = 'display:flex;flex-direction:column;gap:2px';

      for (let day=1; day<=31; day++) {
        const rowEl = document.createElement('div');
        rowEl.style.cssText = 'display:flex;gap:2px;align-items:center';

        /* Day number label */
        const dayLbl = document.createElement('div');
        dayLbl.style.cssText = 'width:20px;text-align:right;font-size:8px;color:var(--muted);flex-shrink:0;padding-right:3px';
        dayLbl.textContent = day;
        rowEl.appendChild(dayLbl);

        for (let month=0; month<12; month++) {
          const cell = document.createElement('div');
          cell.style.cssText = 'flex:1;height:14px;border-radius:2px;min-width:18px';

          if (day > daysInMonth[month]) {
            /* Day doesn't exist in this month (e.g. Feb 30) */
            cell.style.background = 'transparent';
          } else {
            const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
            const isToday  = dateStr === todayStr;
            const isFuture = dateStr > todayStr;
            const entry    = allEntries.find(e=>e.habitId===habit.id && e.date===dateStr);

            if (isFuture) {
              cell.style.background = 'var(--white)';
              cell.style.border = '1px solid var(--border)';
            } else {
              cell.style.background = getDurationColor(habit, entry);
            }
            if (isToday) {
              cell.style.outline = '2px solid '+habit.color;
              cell.style.outlineOffset = '1px';
            }
            cell.title = dateStr;
          }
          rowEl.appendChild(cell);
        }
        gridWrap.appendChild(rowEl);
      }
      card.appendChild(gridWrap);

      /* Legend */
      const legend = document.createElement('div');
      legend.className = 'color-legend';
      legend.style.marginTop = '10px';
      getLegend(habit).forEach(item => {
        legend.innerHTML += `<div class="legend-item">
          <div class="legend-dot" style="background:${item.color}"></div>
          <span>${item.label}</span>
        </div>`;
      });
      card.appendChild(legend);
      container.appendChild(card);
    }

    /* -- RENDER SETTINGS SCREEN -- */
    function renderSettings() {
      const container = document.getElementById('settings-content');
      container.innerHTML = '';

      // Version marker to confirm new file loaded
      const ver = document.createElement('div');
      ver.style.cssText = 'font-size:10px;color:#bbb;margin-bottom:12px';
      ver.textContent = 'Settings v4';
      container.appendChild(ver);

      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = 'Your habits';
      container.appendChild(lbl);

      // Store globally for onclick
      window._habits = habits;

      habits.forEach(function(habit, i) {
        const row = document.createElement('div');
        row.className = 'settings-habit-row';
        row.style.cursor = 'pointer';

        // Use inline onclick string - most reliable method
        row.setAttribute('onclick', 'window._openEdit(' + i + ')');

        const iconDiv = document.createElement('div');
        iconDiv.className = 'shr-icon';
        iconDiv.innerHTML = ICONS[habit.id] || ICONS['mood'];
        iconDiv.style.pointerEvents = 'none'; // prevent icon blocking click

        const infoDiv = document.createElement('div');
        infoDiv.className = 'shr-info';
        infoDiv.style.pointerEvents = 'none';
        infoDiv.innerHTML = '<div class="shr-name">' + habit.name + '</div><div class="shr-sub">Tap to edit</div>';

        const dot = document.createElement('div');
        dot.className = 'shr-dot';
        dot.style.background = habit.color;
        dot.style.pointerEvents = 'none';

        const arrow = document.createElement('div');
        arrow.className = 'shr-arrow';
        arrow.textContent = '>';
        arrow.style.pointerEvents = 'none';

        row.appendChild(iconDiv);
        row.appendChild(infoDiv);
        row.appendChild(dot);
        row.appendChild(arrow);
        container.appendChild(row);
      });

      // Add habit button
      const addBtn = document.createElement('button');
      addBtn.className = 'settings-add-btn';
      addBtn.textContent = '+ Add new habit';
      addBtn.setAttribute('onclick', 'window._openEdit(-1)');
      container.appendChild(addBtn);

      // Global open function
      window._openEdit = function(idx) {
        if (idx === -1) {
          openEditSheet(null, true);
        } else {
          openEditSheet(window._habits[idx], false);
        }
      };
    }

        /* -- OPEN EDIT SHEET -- */
    function openEditSheet(habit, isNew) {
      editingHabit = habit;
      isNewHabit   = isNew;

      // Simply show the overlay - no complex logic
      const overlay = document.getElementById('edit-overlay');
      overlay.style.display = 'flex';

      document.getElementById('edit-title').textContent =
        isNew ? 'Add New Habit' : 'Edit ' + habit.name;
      document.getElementById('edit-name').value =
        isNew ? '' : habit.name;
      document.getElementById('edit-emoji').value =
        isNew ? '' : (habit.emoji || '');
      document.getElementById('edit-delete-btn').style.display =
        isNew ? 'none' : 'block';
      document.getElementById('edit-save-btn').textContent =
        isNew ? '+ Add habit' : 'Save changes';

      // Build color picker
      const picker = document.getElementById('color-picker');
      picker.innerHTML = '';
      selectedColor = isNew ? COLOR_OPTIONS[0] : { color: habit.color, light: habit.light };
      COLOR_OPTIONS.forEach(function(opt) {
        const sw = document.createElement('div');
        sw.className = 'color-swatch' + (opt.color === selectedColor.color ? ' selected' : '');
        sw.style.background = opt.color;
        sw.onclick = function() {
          selectedColor = opt;
          document.querySelectorAll('.color-swatch').forEach(function(s) { s.classList.remove('selected'); });
          sw.classList.add('selected');
        };
        picker.appendChild(sw);
      });
    }

        /* -- CLOSE EDIT SHEET -- */
    function closeEditSheet(event) {
      document.getElementById('edit-overlay').style.display = 'none';
      editingHabit = null;
    }

    /* -- SAVE HABIT EDIT -- */
    async function saveHabitEdit() {
      const name  = document.getElementById('edit-name').value.trim();
      const emoji = document.getElementById('edit-emoji').value.trim();

      if (!name) {
        alert('Please enter a habit name.');
        return;
      }

      const saveBtn = document.getElementById('edit-save-btn');
      saveBtn.textContent = 'Saving...';
      saveBtn.disabled    = true;

      try {
        let habitData;

        if (isNewHabit) {
          // Generate a new unique id from the name
          const newId = 'habit_' + Date.now();
          habitData = {
            id:     newId,
            name:   name,
            emoji:  emoji || '✨',
            color:  selectedColor.color,
            light:  selectedColor.light,
            type:   'study', // default type for custom habits
            order:  habits.length,
            active: true
          };
        } else {
          // Update existing habit
          habitData = {
            ...editingHabit,
            name:  name,
            emoji: emoji || editingHabit.emoji,
            color: selectedColor.color,
            light: selectedColor.light,
          };
        }

        // Save to Google Sheets
        const result = await apiPost('saveHabit', habitData);

        if (result.success) {
          // Update local habits array
          if (isNewHabit) {
            habits.push(habitData);
            // Also add icon placeholder for new habit
            ICONS[habitData.id] = `<svg viewBox="0 0 40 40">
              <circle cx="20" cy="20" r="18" fill="${habitData.light}"/>
              <text x="20" y="26" text-anchor="middle" font-size="18">${habitData.emoji || '✨'}</text>
            </svg>`;
          } else {
            const idx = habits.findIndex(h => h.id === editingHabit.id);
            if (idx !== -1) habits[idx] = habitData;
          }

          // Close sheet and refresh
          document.getElementById('edit-overlay').classList.remove('open');
          renderSettings();
          buildTodayScreen(); // refresh today screen too

          // Show success feedback
          setTimeout(() => {
            const msg = isNewHabit ? 'Habit added! 🎉' : 'Changes saved! ✅';
            alert(msg);
          }, 100);

        } else {
          throw new Error(result.error || 'Save failed');
        }

      } catch(err) {
        console.error(err);
        alert('Could not save. Check your connection and try again.');
      } finally {
        saveBtn.textContent = isNewHabit ? '＋ Add habit' : 'Save changes';
        saveBtn.disabled    = false;
      }
    }

    /* -- DELETE HABIT -- */
    async function deleteHabitEdit() {
      if (!editingHabit) return;
      const confirmed = confirm('Delete ' + editingHabit.name + '? Your logged history is kept safe.');
      if (!confirmed) return;
      try {
        const result = await apiPost('saveHabit', {
          id:     editingHabit.id,
          name:   editingHabit.name,
          color:  editingHabit.color,
          light:  editingHabit.light,
          type:   editingHabit.type,
          order:  editingHabit.order,
          active: false
        });
        if (result.success) {
          habits = habits.filter(h => h.id !== editingHabit.id);
          editingHabit = null;
          document.getElementById('edit-overlay').style.display = 'none';
          renderSettings();
          buildTodayScreen();
        } else {
          throw new Error(result.error || 'Delete failed');
        }
      } catch(err) {
        console.error(err);
        alert('Could not delete. Please remove it directly from Google Sheets habits tab.');
      }
    }

    /* -- EXPORT DATA -- */
    function exportData() {
      const data = {
        exportedAt: new Date().toISOString(),
        habits:     habits,
        entries:    allEntries
      };
      const blob = new Blob(
        [JSON.stringify(data, null, 2)],
        { type: 'application/json' }
      );
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = 'habit-tracker-export-' + getTodayString() + '.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    /* -- STARTUP -- */
    /* Show install banner if not dismissed */
    function checkInstallBanner() {
      if (!localStorage.getItem('banner-dismissed')) {
        const banner = document.getElementById('install-banner');
        if (banner) banner.style.display = 'flex';
      }
    }

    /* Show step-by-step install guide */
    function showInstallGuide() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isAndroid = /Android/.test(navigator.userAgent);

      let msg = '';
      if (isIOS) {
        msg = 'Add to Home Screen on iPhone/iPad:\n\n' +
          '1. Tap the Share button (box with arrow) at bottom of Safari\n' +
          '2. Scroll down and tap "Add to Home Screen"\n' +
          '3. Tap "Add" in the top right\n\n' +
          'The app icon will appear on your home screen!';
      } else if (isAndroid) {
        msg = 'Add to Home Screen on Android:\n\n' +
          '1. Tap the 3-dot menu (...) in Chrome top right\n' +
          '2. Tap "Add to Home screen"\n' +
          '3. Tap "Add"\n\n' +
          'The app icon will appear on your home screen!';
      } else {
        msg = 'To install on your phone:\n\n' +
          'ANDROID (Chrome):\n' +
          '1. Tap ... menu top right\n' +
          '2. Tap "Add to Home screen"\n' +
          '3. Tap "Add"\n\n' +
          'iPHONE (Safari):\n' +
          '1. Tap Share button at bottom\n' +
          '2. Tap "Add to Home Screen"\n' +
          '3. Tap "Add"';
      }
      alert(msg);
    }

    // Close overlay when clicking the dark background
    document.addEventListener('click', function(e) {
      const overlay = document.getElementById('edit-overlay');
      if (e.target === overlay) closeEditSheet();
    });

    window.addEventListener('load', function() {
      // Hide loading screen immediately no matter what
      document.getElementById('loading-screen').style.display = 'none';
      
      const saved = sessionStorage.getItem('ht_user');
      if (saved) {
        try {
          currentUser = JSON.parse(saved);
          startApp();
        } catch(e) {
          sessionStorage.removeItem('ht_user');
          document.getElementById('login-screen').style.display = 'flex';
        }
      } else {
        document.getElementById('login-screen').style.display = 'flex';
      }
    });
  </script>
</body>
</html>
