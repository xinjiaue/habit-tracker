<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Habit Tracker</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --white:#FFFFFF; --surface:#F7F7F4; --border:#EFEFEB;
      --muted:#BBBBBB; --text:#1A1A1A; --radius:12px;
      --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    body {
      font-family:var(--font); background:var(--surface);
      color:var(--text); height:100dvh;
      display:flex; flex-direction:column; overflow:hidden;
    }

    /* ── TOP BAR ── */
    #top-bar {
      background:var(--white); border-bottom:1px solid var(--border);
      padding:14px 18px 12px; flex-shrink:0;
    }
    .top-bar-inner { display:flex; align-items:flex-start; justify-content:space-between; }
    .tb-title { font-size:18px; font-weight:500; }
    .tb-sub   { font-size:11px; color:var(--muted); margin-top:2px; }
    .user-pill {
      background:var(--surface); border:1px solid var(--border);
      border-radius:20px; padding:4px 10px;
      font-size:10px; color:var(--muted); cursor:pointer; white-space:nowrap;
    }

    /* ── CONTENT ── */
    #content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    #content::-webkit-scrollbar { display:none; }

    /* ── SCREENS ── */
    .screen { display:none; }
    .screen.active { display:block; }

    /* ── BOTTOM NAV ── */
    #bottom-nav {
      background:var(--white); border-top:1px solid var(--border);
      display:flex; flex-shrink:0;
      padding-bottom:env(safe-area-inset-bottom);
    }
    .nav-btn {
      flex:1; background:none; border:none; padding:10px 0 12px;
      cursor:pointer; display:flex; flex-direction:column;
      align-items:center; gap:3px; font-size:10px;
      font-family:var(--font); color:var(--muted); transition:color 0.15s;
    }
    .nav-btn .ni { font-size:20px; line-height:1; }
    .nav-btn.active { color:var(--text); }

    /* ── LOGIN SCREEN ── */
    #login-screen {
      position:fixed; inset:0; background:var(--white);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:32px; gap:16px; z-index:999;
    }
    .login-icon  { font-size:64px; }
    .login-title { font-size:24px; font-weight:500; }
    .login-sub   { font-size:13px; color:var(--muted); text-align:center; line-height:1.6; }
    .login-input {
      width:100%; max-width:280px;
      background:var(--surface); border:1.5px solid var(--border);
      border-radius:var(--radius); padding:13px 16px;
      font-size:15px; font-family:var(--font); outline:none; color:var(--text);
    }
    .login-input:focus { border-color:var(--text); }
    .login-btn {
      width:100%; max-width:280px;
      background:var(--text); color:var(--white); border:none;
      border-radius:var(--radius); padding:14px; font-size:15px;
      font-weight:500; font-family:var(--font); cursor:pointer;
    }
    .login-hint { font-size:11px; color:var(--muted); text-align:center; }
    .login-error {
      font-size:12px; color:#DC2626; background:#FEE2E2;
      border-radius:8px; padding:8px 12px;
      width:100%; max-width:280px; text-align:center; display:none;
    }

    /* ── LOADING ── */
    #loading-screen {
      position:fixed; inset:0; background:var(--white);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:16px; z-index:998;
    }
    .loading-icon { font-size:48px; animation:pulse 1.5s ease-in-out infinite; }
    .loading-text { font-size:14px; color:var(--muted); }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

    /* ════════════════════════════════
       TODAY SCREEN
    ════════════════════════════════ */
    #screen-today { padding:14px; }
    .section-label {
      font-size:10px; font-weight:500; color:var(--muted);
      letter-spacing:.08em; text-transform:uppercase; margin-bottom:10px;
    }
    .habit-card {
      background:var(--white); border:1px solid var(--border);
      border-radius:var(--radius); padding:13px 13px 11px;
      margin-bottom:10px; cursor:pointer; transition:transform 0.1s;
    }
    .habit-card:active { transform:scale(0.99); }
    .card-top { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .card-icon { width:40px; height:40px; flex-shrink:0; }
    .card-icon svg { width:100%; height:100%; }
    .card-info { flex:1; min-width:0; }
    .card-name   { font-size:14px; font-weight:500; }
    .card-streak { font-size:10px; color:var(--muted); margin-top:2px; }
    .card-check {
      width:24px; height:24px; border-radius:50%;
      border:1.5px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      font-size:11px; color:var(--white); flex-shrink:0; transition:all 0.2s;
    }
    .card-check.logged { background:var(--text); border-color:var(--text); }
    .grid-wrap { display:flex; flex-direction:column; gap:2px; }
    .grid-row  { display:flex; gap:2px; }
    .grid-cell { flex:1; height:8px; border-radius:2px; }
    .error-banner {
      background:#FEE2E2; border:1px solid #FCA5A5;
      border-radius:var(--radius); padding:12px 14px;
      margin-bottom:12px; font-size:12px; color:#7F1D1D; display:none;
    }

    /* ════════════════════════════════
       LOG SCREEN — Step 3
       This is what we're building now!
    ════════════════════════════════ */
    #screen-log { padding:14px; }

    /*
      LOG NAV — top row with prev/next icons and dots
      Shows which habit you're on.
    */
    .log-nav {
      display:flex; align-items:center;
      justify-content:space-between;
      margin-bottom:12px; gap:8px;
    }

    /* Prev / Next buttons — show the icon of adjacent habit */
    .log-nav-btn {
      width:44px; height:40px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:10px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:background 0.15s;
    }
    .log-nav-btn:active { background:var(--border); }
    .log-nav-btn svg { width:24px; height:24px; }

    /* Dot indicators — one per habit */
    .log-dots {
      display:flex; align-items:center;
      justify-content:center; gap:5px; flex:1;
    }
    .log-dot {
      height:7px; border-radius:4px;
      background:var(--border); cursor:pointer;
      transition:all 0.2s;
      width:7px; /* default = round */
    }
    .log-dot.active {
      width:16px; /* active = wider pill shape */
    }

    /*
      LOG HEADER CARD
      Shows big icon + habit name + "X of 6"
      Background color = habit's light color.
    */
    .log-header {
      border-radius:16px; padding:20px;
      margin-bottom:16px; text-align:center;
    }
    .log-header-icon {
      display:flex; justify-content:center; margin-bottom:10px;
    }
    .log-header-icon svg { width:64px; height:64px; }
    .log-header-name {
      font-size:20px; font-weight:500; margin-bottom:4px;
    }
    .log-header-sub { font-size:12px; opacity:.6; }

    /*
      FORM ELEMENTS
      Labels, inputs, dropdowns, save button.
    */
    .form-group { margin-bottom:12px; }

    .form-label {
      font-size:10px; font-weight:500; color:var(--muted);
      text-transform:uppercase; letter-spacing:.06em;
      display:block; margin-bottom:5px;
    }

    /* All inputs and dropdowns share this style */
    .form-input {
      width:100%;
      background:var(--surface); border:1.5px solid var(--border);
      border-radius:10px; padding:11px 14px;
      font-size:15px; font-family:var(--font);
      color:var(--text); outline:none;
      transition:border-color 0.15s;
      appearance:none; /* removes default browser styling on select */
      -webkit-appearance:none;
    }
    .form-input:focus { border-color:var(--text); }

    /*
      DURATION PILL
      Shows auto-calculated sleep duration.
      Background = habit's light color.
      Text = habit's accent color.
    */
    .duration-pill {
      border-radius:12px; padding:14px;
      text-align:center; margin-bottom:12px;
    }
    .duration-val {
      font-size:30px; font-weight:500; line-height:1;
    }
    .duration-lbl {
      font-size:11px; opacity:.6; margin-top:4px;
    }

    /*
      MOOD SELECTOR
      5 emoji buttons in a row.
      Tap one to select it.
    */
    .mood-row {
      display:flex; gap:8px;
    }
    .mood-btn {
      flex:1; background:var(--surface);
      border:2px solid var(--border);
      border-radius:12px; padding:10px 4px;
      font-size:22px; cursor:pointer;
      text-align:center; transition:all 0.15s;
      font-family:var(--font);
    }
    /* Selected mood = colored border + light background */
    .mood-btn.selected {
      transform:scale(1.08);
    }

    /* SAVE BUTTON */
    .save-btn {
      width:100%; border:none;
      border-radius:14px; padding:15px;
      font-size:15px; font-weight:500;
      font-family:var(--font); cursor:pointer;
      margin-top:4px; transition:opacity 0.15s;
      color:var(--white);
    }
    .save-btn:active { opacity:.85; }

    /* SAVING STATE — shows while saving to Sheets */
    .save-btn.saving {
      opacity:.6; cursor:not-allowed;
    }

    /* SUCCESS MESSAGE — shown after save */
    .save-success {
      background:#D1FAE5; border:1px solid #6EE7B7;
      border-radius:var(--radius); padding:12px 14px;
      text-align:center; font-size:13px; color:#065F46;
      margin-top:10px; display:none;
    }

    /* REPORTS + SETTINGS placeholder */
    #screen-reports, #screen-settings { padding:14px; }
    .placeholder-screen {
      text-align:center; padding:48px 20px; color:var(--muted);
    }
    .placeholder-screen .ph-icon  { font-size:40px; margin-bottom:12px; }
    .placeholder-screen .ph-title {
      font-size:15px; font-weight:500;
      color:var(--text); margin-bottom:6px;
    }
  </style>
</head>
<body>

  <!-- LOADING -->
  <div id="loading-screen">
    <div class="loading-icon">✨</div>
    <div class="loading-text">Loading your habits...</div>
  </div>

  <!-- LOGIN -->
  <div id="login-screen" style="display:none">
    <div class="login-icon">✨</div>
    <div class="login-title">Habit Tracker</div>
    <div class="login-sub">Track your daily habits beautifully.<br>Enter your email to keep data private.</div>
    <input class="login-input" type="email" id="email-input"
      placeholder="your@gmail.com"
      onkeydown="if(event.key==='Enter') startLogin()">
    <div class="login-error" id="login-error"></div>
    <button class="login-btn" onclick="startLogin()">Start tracking →</button>
    <div class="login-hint">Your data is stored separately per email.<br>No password needed.</div>
  </div>

  <!-- TOP BAR -->
  <div id="top-bar">
    <div class="top-bar-inner">
      <div>
        <div class="tb-title" id="tb-title">My habits</div>
        <div class="tb-sub"   id="tb-sub">Loading...</div>
      </div>
      <div class="user-pill" id="user-pill" onclick="signOut()">sign out</div>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="content">

    <!-- SCREEN 1: TODAY -->
    <div class="screen active" id="screen-today">
      <div class="error-banner" id="error-banner"></div>
      <div class="section-label">Today's habits</div>
      <div id="today-cards"></div>
    </div>

    <!-- SCREEN 2: LOG — built by JavaScript -->
    <div class="screen" id="screen-log">
      <!--
        This entire screen is built by JavaScript.
        The renderLogScreen() function creates:
        1. Nav row (prev icon + dots + next icon)
        2. Header card (big icon + name + counter)
        3. Form (different per habit type)
        4. Save button
      -->
    </div>

    <!-- SCREEN 3: REPORTS -->
    <div class="screen" id="screen-reports">
      <div class="placeholder-screen">
        <div class="ph-icon">📊</div>
        <div class="ph-title">Reports Screen</div>
        Coming in Step 5
      </div>
    </div>

    <!-- SCREEN 4: SETTINGS -->
    <div class="screen" id="screen-settings">
      <div class="placeholder-screen">
        <div class="ph-icon">⚙️</div>
        <div class="ph-title">Settings Screen</div>
        Coming in Step 6
      </div>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <nav id="bottom-nav">
    <button class="nav-btn active" onclick="navigate('today','My habits',this)">
      <span class="ni">🏠</span><span>Today</span>
    </button>
    <button class="nav-btn" onclick="navigate('log','Log entry',this)">
      <span class="ni">➕</span><span>Log</span>
    </button>
    <button class="nav-btn" onclick="navigate('reports','Reports',this)">
      <span class="ni">📊</span><span>Reports</span>
    </button>
    <button class="nav-btn" onclick="navigate('settings','Settings',this)">
      <span class="ni">⚙️</span><span>Settings</span>
    </button>
  </nav>

  <script>
    /* ══════════════════════════════════════════
       CONFIGURATION
    ══════════════════════════════════════════ */
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxWl3z2ur3jYakNyFQXk1zDOWAAWsEDthQmUMlZ2eCZwSmjXWuTTMAb6u5IN8iSxLGPuA/exec';

    /* ── STATE ── */
    let currentUser  = null;
    let habits       = [];
    let todayEntries = [];
    let curHabitIdx  = 0; // which habit is shown on Log screen

    /* ══════════════════════════════════════════
       SVG ICONS
    ══════════════════════════════════════════ */
    const ICONS = {
      sleep:`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#EDE9FE"/><path d="M24 7 Q10 10 10 20 Q10 30 24 33 Q14 31 9 22 Q4 13 10 8 Q15 4 24 7Z" fill="#A78BFA"/><path d="M22 9 Q13 12 13 20 Q13 28 22 31 Q14 28 11 21 Q8 14 13 10 Q16 7 22 9Z" fill="#C4B5FD" opacity=".35"/><path d="M30 8 L31 5 L32 8 L35 9 L32 10 L31 13 L30 10 L27 9Z" fill="#FCD34D"/><path d="M34 18 L35 15 L36 18 L39 19 L36 20 L35 23 L34 20 L31 19Z" fill="#FDE68A"/><circle cx="32" cy="26" r="1.5" fill="#FCD34D" opacity=".7"/><text x="26" y="25" font-size="5" fill="#7C3AED" font-weight="600" font-family="sans-serif">z</text><text x="30" y="21" font-size="6" fill="#7C3AED" font-weight="600" font-family="sans-serif">z</text><text x="34" y="16" font-size="7" fill="#7C3AED" font-weight="600" font-family="sans-serif">z</text></svg>`,
      exercise:`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#D1FAE5"/><circle cx="24" cy="7" r="3" fill="#F472B6"/><circle cx="19" cy="11" r="5" fill="#FDDCB5"/><ellipse cx="21" cy="9" rx="5" ry="2.5" fill="#F472B6"/><path d="M16 10 Q17.5 9 19 10" stroke="#92400E" stroke-width=".8" fill="none" stroke-linecap="round"/><path d="M16 12 Q17.5 13.5 19 12" stroke="#92400E" stroke-width=".7" fill="none" stroke-linecap="round"/><circle cx="14" cy="12" r="1.5" fill="#FCA5A5" opacity=".5"/><circle cx="22" cy="12" r="1.5" fill="#FCA5A5" opacity=".5"/><path d="M12 17 Q19 13 27 17 L25 27 Q19 30 13 27Z" fill="#34D399"/><line x1="25" y1="18" x2="31" y2="13" stroke="#FDDCB5" stroke-width="2.5" stroke-linecap="round"/><rect x="29" y="10" width="7" height="2.5" rx="1.2" fill="#059669"/><rect x="28" y="9" width="2.5" height="4.5" rx="1.2" fill="#047857"/><rect x="34" y="9" width="2.5" height="4.5" rx="1.2" fill="#047857"/><line x1="12" y1="18" x2="8" y2="22" stroke="#FDDCB5" stroke-width="2.5" stroke-linecap="round"/><line x1="14" y1="27" x2="11" y2="33" stroke="#FDDCB5" stroke-width="2.5" stroke-linecap="round"/><line x1="22" y1="27" x2="25" y2="33" stroke="#FDDCB5" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="10" cy="34" rx="3" ry="1.8" fill="#F472B6"/><ellipse cx="26" cy="34" rx="3" ry="1.8" fill="#F472B6"/></svg>`,
      mood:`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#FFEDD5"/><circle cx="20" cy="22" r="13" fill="#FCD34D"/><path d="M13 19 Q15 16 17 19" stroke="#92400E" stroke-width="1.2" fill="none" stroke-linecap="round"/><path d="M23 19 Q25 16 27 19" stroke="#92400E" stroke-width="1.2" fill="none" stroke-linecap="round"/><path d="M13 26 Q20 33 27 26" stroke="#92400E" stroke-width="1.5" fill="#FEF3C7" stroke-linecap="round"/><circle cx="11" cy="26" r="4" fill="#FCA5A5" opacity=".5"/><circle cx="29" cy="26" r="4" fill="#FCA5A5" opacity=".5"/><path d="M32 9 L33 6 L34 9 L37 10 L34 11 L33 14 L32 11 L29 10Z" fill="#FCD34D" opacity=".8"/></svg>`,
      finance:`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#FEF3C7"/><rect x="5" y="14" width="22" height="16" rx="3" fill="#FBBF24"/><rect x="5" y="14" width="22" height="6" rx="3" fill="#F59E0B"/><rect x="8" y="17" width="10" height="3" rx="1.2" fill="#FDE68A"/><circle cx="22" cy="25" r="5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/><text x="22" y="28" text-anchor="middle" font-size="6" fill="#78350F" font-weight="500" font-family="sans-serif">¥</text><rect x="25" y="7" width="12" height="9" rx="3" fill="#FFFBEB" stroke="#FDE68A" stroke-width=".8"/><polyline points="27,13 29,10 31,11 35,7" stroke="#FBBF24" stroke-width="1" fill="none" stroke-linecap="round"/><line x1="35" y1="7" x2="37" y2="5" stroke="#059669" stroke-width="1" stroke-linecap="round"/></svg>`,
      language:`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#E0F2FE"/><rect x="4" y="10" width="30" height="18" rx="8" fill="#38BDF8"/><polygon points="10,28 6,36 18,28" fill="#38BDF8"/><text x="19" y="21" text-anchor="middle" font-size="6.5" fill="#fff" font-weight="500" font-family="sans-serif">こんにちは</text><text x="19" y="28" text-anchor="middle" font-size="5" fill="#BAE6FD" font-family="sans-serif">Hello!</text><rect x="28" y="6" width="10" height="7" rx="3" fill="#0EA5E9"/><text x="33" y="11" text-anchor="middle" font-size="5" fill="#fff" font-weight="500" font-family="sans-serif">Hi!</text></svg>`,
      tech:`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#FCE7F3"/><rect x="6" y="12" width="28" height="18" rx="3" fill="#1E1E2E"/><rect x="9" y="15" width="22" height="12" rx="2" fill="#0D0D1A"/><text x="11" y="21" font-size="4" fill="#F472B6" font-family="monospace" font-weight="500">&lt;AI&gt;</text><text x="11" y="25" font-size="3.5" fill="#34D399" font-family="monospace">def learn():</text><text x="13" y="29" font-size="3.5" fill="#38BDF8" font-family="monospace">  code=💻</text><rect x="10" y="31" width="20" height="2" rx="1" fill="#2D2D44"/><rect x="6" y="6" width="9" height="6" rx="2" fill="#A78BFA"/><text x="10.5" y="10.5" text-anchor="middle" font-size="4" fill="#fff" font-weight="600" font-family="sans-serif">AI</text><rect x="28" y="6" width="9" height="6" rx="2" fill="#F472B6"/><text x="32.5" y="10.5" text-anchor="middle" font-size="5" fill="#fff" font-weight="700" font-family="monospace">{}</text></svg>`
    };

    /* ══════════════════════════════════════════
       DATE HELPERS
    ══════════════════════════════════════════ */
    function getTodayString() {
      const d = new Date();
      return d.getFullYear() + '-' +
        String(d.getMonth()+1).padStart(2,'0') + '-' +
        String(d.getDate()).padStart(2,'0');
    }
    function formatDateNice(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    }

    /* ══════════════════════════════════════════
       API — talk to Google Sheets
    ══════════════════════════════════════════ */
    async function apiGet(action, params={}) {
      params.action    = action;
      params.userEmail = currentUser.email;
      const url = SCRIPT_URL + '?' + new URLSearchParams(params).toString();
      const res = await fetch(url);
      return await res.json();
    }
    async function apiPost(action, body={}) {
      body.action    = action;
      body.userEmail = currentUser.email;
      const res = await fetch(SCRIPT_URL, { method:'POST', body:JSON.stringify(body) });
      return await res.json();
    }

    /* ══════════════════════════════════════════
       LOGIN
    ══════════════════════════════════════════ */
    function startLogin() {
      const email = document.getElementById('email-input').value.trim().toLowerCase();
      const errEl = document.getElementById('login-error');
      if (!email || !email.includes('@') || !email.includes('.')) {
        errEl.style.display = 'block';
        errEl.textContent   = 'Please enter a valid email address.';
        return;
      }
      errEl.style.display = 'none';
      currentUser = { email, name: email.split('@')[0] };
      sessionStorage.setItem('ht_user', JSON.stringify(currentUser));
      document.getElementById('login-screen').style.display = 'none';
      startApp();
    }

    function signOut() {
      if (!confirm('Sign out?')) return;
      sessionStorage.removeItem('ht_user');
      currentUser = null; habits = []; todayEntries = [];
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('today-cards').innerHTML = '';
    }

    /* ══════════════════════════════════════════
       START APP
    ══════════════════════════════════════════ */
    async function startApp() {
      document.getElementById('loading-screen').style.display = 'flex';
      document.getElementById('user-pill').textContent = currentUser.name + ' · sign out';
      try {
        await apiPost('initHabits', {});
        habits = await apiGet('getHabits');
        const today = getTodayString();
        todayEntries = await apiGet('getEntries', { date: today });
        document.getElementById('tb-sub').textContent = formatDateNice(today);
        buildTodayScreen();
        document.getElementById('loading-screen').style.display = 'none';
      } catch(err) {
        console.error(err);
        document.getElementById('loading-screen').style.display = 'none';
        const b = document.getElementById('error-banner');
        b.style.display = 'block';
        b.textContent   = '⚠️ Could not connect. Check your internet.';
      }
    }

    /* ══════════════════════════════════════════
       BUILD GRID — contribution squares
    ══════════════════════════════════════════ */
    function buildGrid(habitId, color, light) {
      const ROWS=4, COLS=22, today=new Date();
      const wrap = document.createElement('div');
      wrap.className = 'grid-wrap';
      for (let r=0; r<ROWS; r++) {
        const row = document.createElement('div');
        row.className = 'grid-row';
        for (let c=0; c<COLS; c++) {
          const daysAgo  = (ROWS*COLS-1)-(r*COLS+c);
          const cellDate = new Date(today);
          cellDate.setDate(today.getDate()-daysAgo);
          const dateStr  = cellDate.toISOString().split('T')[0];
          const isLogged = todayEntries.some(e=>e.habitId===habitId && e.date===dateStr);
          const isToday  = daysAgo===0;
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          if (isToday) {
            cell.style.background    = isLogged ? color : light;
            cell.style.outline       = '2px solid '+color;
            cell.style.outlineOffset = '1px';
          } else {
            cell.style.background = isLogged ? color : light;
          }
          row.appendChild(cell);
        }
        wrap.appendChild(row);
      }
      return wrap;
    }

    /* ══════════════════════════════════════════
       BUILD TODAY SCREEN
    ══════════════════════════════════════════ */
    function buildTodayScreen() {
      const container = document.getElementById('today-cards');
      container.innerHTML = '';
      if (!habits.length) {
        container.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--muted)">
          <div style="font-size:40px;margin-bottom:12px">✨</div>
          <div style="font-size:15px;font-weight:500;color:var(--text);margin-bottom:6px">No habits yet</div>
          Go to Settings to add habits.
        </div>`;
        return;
      }
      habits.forEach(function(habit, idx) {
        const isLogged = todayEntries.some(e=>e.habitId===habit.id);
        const card = document.createElement('div');
        card.className = 'habit-card';
        card.onclick   = () => goLog(idx); // tap card → open log for this habit
        const topRow = document.createElement('div');
        topRow.className = 'card-top';
        const iconDiv = document.createElement('div');
        iconDiv.className = 'card-icon';
        iconDiv.innerHTML = ICONS[habit.id] || ICONS['mood'];
        const infoDiv = document.createElement('div');
        infoDiv.className = 'card-info';
        infoDiv.innerHTML = `
          <div class="card-name">${habit.name}</div>
          <div class="card-streak">${isLogged ? '🔥 Logged today' : 'Tap to log'}</div>`;
        const checkEl = document.createElement('div');
        checkEl.className = 'card-check' + (isLogged ? ' logged' : '');
        checkEl.textContent = isLogged ? '✓' : '';
        topRow.appendChild(iconDiv);
        topRow.appendChild(infoDiv);
        topRow.appendChild(checkEl);
        card.appendChild(topRow);
        card.appendChild(buildGrid(habit.id, habit.color, habit.light));
        container.appendChild(card);
      });
    }

    /* ══════════════════════════════════════════
       LOG SCREEN — Step 3
       This is the new code!

       goLog(idx) — called when tapping a card
       or nav button. Sets curHabitIdx and
       renders the log screen for that habit.
    ══════════════════════════════════════════ */
    function goLog(idx) {
      curHabitIdx = idx;
      // Switch to log screen
      const logBtn = document.querySelectorAll('.nav-btn')[1];
      navigate('log', 'Log entry', logBtn);
      // Build the screen content
      renderLogScreen();
    }

    /*
      renderLogScreen()
      ─────────────────
      Builds the entire log screen for the
      currently selected habit (curHabitIdx).

      Called every time:
      - User taps a habit card
      - User taps ← or → nav buttons
      - User taps a dot indicator
    */
    function renderLogScreen() {
      const habit = habits[curHabitIdx];
      const screen = document.getElementById('screen-log');
      screen.innerHTML = ''; // clear previous content

      /* ── 1. NAV ROW (prev icon + dots + next icon) ── */
      const navRow = document.createElement('div');
      navRow.className = 'log-nav';

      // Prev button — shows previous habit's icon
      const prevIdx = (curHabitIdx - 1 + habits.length) % habits.length;
      const prevBtn = document.createElement('button');
      prevBtn.className = 'log-nav-btn';
      prevBtn.innerHTML = ICONS[habits[prevIdx].id] || '←';
      prevBtn.onclick   = () => { curHabitIdx = prevIdx; renderLogScreen(); };
      prevBtn.title     = habits[prevIdx].name;

      // Dots row
      const dotsWrap = document.createElement('div');
      dotsWrap.className = 'log-dots';
      habits.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'log-dot' + (i === curHabitIdx ? ' active' : '');
        // Active dot uses habit's accent color
        dot.style.background = i === curHabitIdx ? habit.color : '';
        dot.onclick = () => { curHabitIdx = i; renderLogScreen(); };
        dotsWrap.appendChild(dot);
      });

      // Next button — shows next habit's icon
      const nextIdx = (curHabitIdx + 1) % habits.length;
      const nextBtn = document.createElement('button');
      nextBtn.className = 'log-nav-btn';
      nextBtn.innerHTML = ICONS[habits[nextIdx].id] || '→';
      nextBtn.onclick   = () => { curHabitIdx = nextIdx; renderLogScreen(); };
      nextBtn.title     = habits[nextIdx].name;

      navRow.appendChild(prevBtn);
      navRow.appendChild(dotsWrap);
      navRow.appendChild(nextBtn);

      /* ── 2. HEADER CARD ── */
      const header = document.createElement('div');
      header.className = 'log-header';
      header.style.background = habit.light; // habit's light color
      header.innerHTML = `
        <div class="log-header-icon">${ICONS[habit.id] || ICONS['mood']}</div>
        <div class="log-header-name" style="color:${habit.color}">${habit.name}</div>
        <div class="log-header-sub"  style="color:${habit.color}">${curHabitIdx + 1} of ${habits.length}</div>`;

      /* ── 3. FORM — different per habit type ── */
      const formWrap = document.createElement('div');

      if (habit.type === 'sleep') {
        formWrap.innerHTML = buildSleepForm(habit);
      } else if (habit.type === 'exercise') {
        formWrap.innerHTML = buildExerciseForm(habit);
      } else if (habit.type === 'mood') {
        formWrap.innerHTML = buildMoodForm(habit);
      } else {
        // 'study' type covers finance, language, tech
        formWrap.innerHTML = buildStudyForm(habit);
      }

      /* ── 4. SAVE BUTTON ── */
      const saveBtn = document.createElement('button');
      saveBtn.className = 'save-btn';
      saveBtn.id        = 'save-btn';
      saveBtn.style.background = habit.color;
      saveBtn.textContent = 'Save ' + habit.name.toLowerCase() + ' ✓';
      saveBtn.onclick = () => saveEntry(habit);

      /* ── 5. SUCCESS MESSAGE ── */
      const successMsg = document.createElement('div');
      successMsg.className = 'save-success';
      successMsg.id = 'save-success';
      successMsg.textContent = '✅ Saved! Great job today 🎉';

      /* ── ASSEMBLE ── */
      screen.appendChild(navRow);
      screen.appendChild(header);
      screen.appendChild(formWrap);
      screen.appendChild(saveBtn);
      screen.appendChild(successMsg);

      // After building, wire up sleep time pickers
      if (habit.type === 'sleep') {
        wireSleepCalc(habit);
      }

      // After building, wire up mood buttons
      if (habit.type === 'mood') {
        wireMoodBtns(habit);
      }
    }

    /* ══════════════════════════════════════════
       FORM BUILDERS
       Each returns an HTML string for that habit.
    ══════════════════════════════════════════ */

    function buildSleepForm(habit) {
      /*
        Sleep form:
        - Bedtime picker (time input)
        - Wake up picker (time input)
        - Auto-calculated duration pill
      */
      return `
        <div class="form-group">
          <label class="form-label">Bedtime</label>
          <input class="form-input" type="time" id="inp-bedtime" value="22:30">
        </div>
        <div class="form-group">
          <label class="form-label">Wake up</label>
          <input class="form-input" type="time" id="inp-wakeup" value="06:30">
        </div>
        <div class="duration-pill" id="dur-pill" style="background:${habit.light}">
          <div class="duration-val" id="dur-val" style="color:${habit.color}">8h 0m</div>
          <div class="duration-lbl" style="color:${habit.color}">calculated sleep duration</div>
        </div>`;
    }

    function buildExerciseForm(habit) {
      return `
        <div class="form-group">
          <label class="form-label">Activity type</label>
          <select class="form-input" id="inp-activity">
            <option>Gym workout</option>
            <option>Running</option>
            <option>Walking</option>
            <option>Cycling</option>
            <option>Yoga / stretching</option>
            <option>Swimming</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Duration (minutes)</label>
          <input class="form-input" type="number" id="inp-duration" value="30" min="1" max="300">
        </div>
        <div class="form-group">
          <label class="form-label">Notes (optional)</label>
          <input class="form-input" type="text" id="inp-notes" placeholder="e.g. 5km run, chest day...">
        </div>`;
    }

    function buildMoodForm(habit) {
      /*
        Mood form:
        - 5 emoji buttons (😞 😕 😐 😊 😄)
        - Optional note text input
      */
      const emojis = ['😞','😕','😐','😊','😄'];
      const labels = ['Awful','Bad','OK','Good','Great'];
      let btns = '';
      emojis.forEach((emoji, i) => {
        btns += `<button class="mood-btn" id="mood-${i+1}"
          onclick="selectMood(${i+1})"
          title="${labels[i]}">${emoji}</button>`;
      });
      return `
        <div class="form-group">
          <label class="form-label">How are you feeling today?</label>
          <div class="mood-row">${btns}</div>
        </div>
        <div class="form-group">
          <label class="form-label">Note (optional)</label>
          <input class="form-input" type="text" id="inp-mood-note"
            placeholder="What's on your mind?">
        </div>`;
    }

    function buildStudyForm(habit) {
      /*
        Study form — used for Finance, Language, Technology.
        Labels change per habit.
      */
      const configs = {
        finance:  {
          topicLabel: 'Topic / subject',
          topicPlaceholder: 'e.g. investing, budgeting, stocks',
          resourceLabel: 'Resource type',
          resources: ['Book','Podcast','YouTube','Course','News / article','Other']
        },
        language: {
          topicLabel: 'Language',
          topicPlaceholder: 'e.g. Japanese, English, Thai',
          resourceLabel: 'Activity type',
          resources: ['Anki / flashcards','Reading','Listening','Speaking practice','Writing','Grammar study']
        },
        tech: {
          topicLabel: 'Topic / skill',
          topicPlaceholder: 'e.g. HTML, JavaScript, Python, AI',
          resourceLabel: 'Resource',
          resources: ['YouTube','Online course','Book','Documentation','Project practice','Other']
        }
      };

      // Default to tech config if id not found
      const cfg = configs[habit.id] || configs['tech'];

      let options = cfg.resources.map(r => `<option>${r}</option>`).join('');

      return `
        <div class="form-group">
          <label class="form-label">${cfg.topicLabel}</label>
          <input class="form-input" type="text" id="inp-topic"
            placeholder="${cfg.topicPlaceholder}">
        </div>
        <div class="form-group">
          <label class="form-label">Duration (minutes)</label>
          <input class="form-input" type="number" id="inp-duration"
            value="30" min="1" max="480">
        </div>
        <div class="form-group">
          <label class="form-label">${cfg.resourceLabel}</label>
          <select class="form-input" id="inp-resource">${options}</select>
        </div>`;
    }

    /* ══════════════════════════════════════════
       FORM WIRING — connect inputs to logic
    ══════════════════════════════════════════ */

    /*
      wireSleepCalc()
      ───────────────
      Listens for changes on bedtime/wakeup inputs.
      Calculates duration and updates the pill display.
    */
    function wireSleepCalc(habit) {
      function calc() {
        const bed  = document.getElementById('inp-bedtime')?.value;
        const wake = document.getElementById('inp-wakeup')?.value;
        if (!bed || !wake) return;

        // Parse hours and minutes
        const [bh, bm] = bed.split(':').map(Number);
        const [wh, wm] = wake.split(':').map(Number);

        // Calculate minutes difference
        // If wake < bed (e.g. bed 23:00, wake 07:00), add 24 hours
        let totalMins = (wh * 60 + wm) - (bh * 60 + bm);
        if (totalMins < 0) totalMins += 1440; // 1440 = 24 * 60

        const hours = Math.floor(totalMins / 60);
        const mins  = totalMins % 60;

        // Update the display
        const durEl = document.getElementById('dur-val');
        if (durEl) durEl.textContent = hours + 'h ' + (mins > 0 ? mins + 'm' : '');
      }

      // Run on every change
      document.getElementById('inp-bedtime')?.addEventListener('change', calc);
      document.getElementById('inp-wakeup')?.addEventListener('change', calc);
      calc(); // run once on load
    }

    /*
      selectMood(score)
      ─────────────────
      Highlights the selected mood button.
      Stores selected score in a variable.
    */
    let selectedMood = 3; // default = OK 😐

    function selectMood(score) {
      selectedMood = score;
      const habit = habits[curHabitIdx];

      // Update all 5 buttons
      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById('mood-' + i);
        if (!btn) continue;
        if (i === score) {
          // Selected style
          btn.classList.add('selected');
          btn.style.borderColor = habit.color;
          btn.style.background  = habit.light;
          btn.style.transform   = 'scale(1.12)';
        } else {
          // Unselected style
          btn.classList.remove('selected');
          btn.style.borderColor = '';
          btn.style.background  = '';
          btn.style.transform   = '';
        }
      }
    }

    function wireMoodBtns(habit) {
      // Set default selection to 😐 (3)
      selectMood(3);
    }

    /* ══════════════════════════════════════════
       SAVE ENTRY
       Collects form data and sends to Google Sheets.
    ══════════════════════════════════════════ */
    async function saveEntry(habit) {
      const saveBtn    = document.getElementById('save-btn');
      const successMsg = document.getElementById('save-success');

      // Show saving state
      saveBtn.textContent = 'Saving...';
      saveBtn.classList.add('saving');
      saveBtn.disabled = true;

      try {
        // Collect data from form based on habit type
        let value = {};

        if (habit.type === 'sleep') {
          const bed  = document.getElementById('inp-bedtime').value;
          const wake = document.getElementById('inp-wakeup').value;
          const [bh,bm] = bed.split(':').map(Number);
          const [wh,wm] = wake.split(':').map(Number);
          let mins = (wh*60+wm)-(bh*60+bm);
          if (mins<0) mins+=1440;
          value = {
            bedtime:  bed,
            wakeup:   wake,
            duration: parseFloat((mins/60).toFixed(2))
          };

        } else if (habit.type === 'exercise') {
          value = {
            activity: document.getElementById('inp-activity').value,
            duration: Number(document.getElementById('inp-duration').value),
            notes:    document.getElementById('inp-notes').value
          };

        } else if (habit.type === 'mood') {
          value = {
            score: selectedMood,
            note:  document.getElementById('inp-mood-note').value
          };

        } else {
          // study type (finance, language, tech)
          value = {
            topic:    document.getElementById('inp-topic').value,
            duration: Number(document.getElementById('inp-duration').value),
            resource: document.getElementById('inp-resource').value
          };
        }

        // Send to Google Sheets
        const result = await apiPost('saveEntry', {
          habitId: habit.id,
          date:    getTodayString(),
          value:   value
        });

        if (result.success) {
          // Update local todayEntries so Today screen updates immediately
          // Remove old entry for this habit today (if any)
          todayEntries = todayEntries.filter(e => e.habitId !== habit.id);
          // Add the new entry
          todayEntries.push({
            id:      result.id,
            habitId: habit.id,
            date:    getTodayString(),
            value:   value
          });

          // Show success message
          saveBtn.textContent = 'Saved ✓';
          saveBtn.style.background = '#059669'; // green
          successMsg.style.display = 'block';

          // Rebuild today screen so checkmark updates
          buildTodayScreen();

          // After 2 seconds, restore button
          setTimeout(() => {
            saveBtn.textContent      = 'Save ' + habit.name.toLowerCase() + ' ✓';
            saveBtn.style.background = habit.color;
            saveBtn.classList.remove('saving');
            saveBtn.disabled         = false;
            successMsg.style.display = 'none';
          }, 2000);

        } else {
          throw new Error(result.error || 'Save failed');
        }

      } catch(err) {
        console.error('Save error:', err);
        saveBtn.textContent      = 'Error — tap to retry';
        saveBtn.style.background = '#DC2626'; // red
        saveBtn.classList.remove('saving');
        saveBtn.disabled = false;
      }
    }

    /* ══════════════════════════════════════════
       NAVIGATION
    ══════════════════════════════════════════ */
    function navigate(name, title, btn) {
      document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
      document.getElementById('screen-'+name).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      document.getElementById('tb-title').textContent = title;
      document.getElementById('content').scrollTop = 0;

      // When switching TO log screen without a specific habit,
      // default to first habit
      if (name === 'log' && habits.length > 0) {
        renderLogScreen();
      }
    }

    /* ══════════════════════════════════════════
       STARTUP
    ══════════════════════════════════════════ */
    window.addEventListener('load', function() {
      const saved = sessionStorage.getItem('ht_user');
      if (saved) {
        currentUser = JSON.parse(saved);
        startApp();
      } else {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('login-screen').style.display   = 'flex';
      }
    });
  </script>
</body>
</html>
